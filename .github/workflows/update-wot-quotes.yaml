name: Update WoT quotes

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for new quote
        run: python3 scripts/update-wot-quotes.py

      - name: Commit quote updates
        run: |
          if git diff --quiet -- i3blocks/scripts/wot-quotes.tsv; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i3blocks/scripts/wot-quotes.tsv
          git commit -m "Update WoT quotes"
          git push
